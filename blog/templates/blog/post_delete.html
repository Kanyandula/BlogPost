{% extends 'base.html' %}

{% block title %}Delete Post | NyasaBlog{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-6 md:px-12">
  <div class="bg-surface-container-lowest rounded-xl p-6 md:p-8">
    <div class="bg-error-container text-on-error-container px-4 py-3 rounded-lg mb-6 text-sm">
      <span class="material-symbols-outlined text-base align-middle mr-1">warning</span>
      Are you sure you want to delete this post? This action cannot be undone.
    </div>
    <h2 class="text-lg font-bold text-primary mb-6">{{ post.title }}</h2>
    <form method="POST" class="flex gap-3">
      {% csrf_token %}
      <a href="{% url 'blog:detail' post.slug %}" class="bg-surface-container-high text-on-surface px-6 py-2.5 rounded-lg font-medium hover:bg-surface-container-highest transition-colors">Cancel</a>
      <button type="submit" class="bg-error text-on-error px-6 py-2.5 rounded-lg font-semibold hover:opacity-90 transition-opacity">Delete</button>
    </form>
  </div>
</div>
{% endblock content %}
