{% extends 'base.html' %}

{% block title %}Reset Password | NyasaBlog{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-6">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 md:p-10">
    <div class="text-center mb-6">
      <span class="material-symbols-outlined text-4xl text-primary mb-2">lock_reset</span>
      <h1 class="text-2xl font-bold text-primary">Reset Password</h1>
      <p class="text-sm text-on-surface-variant mt-1">Enter your email and we'll send you a reset link</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1">Email address</label>
        <input name="email" type="email" required placeholder="you@example.com"
               class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-secondary/20 focus:border-secondary"/>
      </div>
      <button type="submit" class="w-full bg-primary-container text-on-primary py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">Send Reset Email</button>
    </form>

    <p class="text-center text-sm text-on-surface-variant mt-6">
      <a href="{% url 'login' %}" class="text-secondary font-medium hover:underline">Back to Sign In</a>
    </p>
  </div>
</div>
{% endblock content %}
