{% extends 'base.html' %}

{% block title %}Sign In | NyasaBlog{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-6">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 md:p-10">
    <div class="text-center mb-8">
      <a href="{% url 'home' %}" class="text-3xl font-black tracking-tighter text-primary">NyasaBlog</a>
      <h1 class="text-2xl font-bold text-primary mt-4">Welcome back</h1>
      <p class="text-sm text-on-surface-variant mt-1">Sign in to continue your journey</p>
    </div>

    <div id="login-form-container">
      {% include 'account/partials/login_form.html' %}
    </div>

    <div class="flex items-center gap-4 my-6">
      <div class="flex-1 h-px bg-outline-variant/20"></div>
      <span class="text-xs text-on-surface-variant">or</span>
      <div class="flex-1 h-px bg-outline-variant/20"></div>
    </div>

    <p class="text-center text-sm text-on-surface-variant">
      Don't have an account? <a href="{% url 'register' %}" class="text-secondary font-semibold hover:underline">Create one</a>
    </p>
  </div>
</div>
{% endblock content %}
