name: Write CI test settings.ini
description: |
  Write a non-secret settings.ini for CI. DEBUG=True so the production S3
  storage path stays gated; AWS_* keys are intentionally empty. SITE_DOMAIN
  and SITE_PROTOCOL match what mysite/settings.py expects after PR #35.

runs:
  using: composite
  steps:
    - name: Write settings.ini
      shell: bash
      run: |
        cat > settings.ini <<'EOF'
        [settings]
        SECRET_KEY=ci-test-key-not-for-production
        DEBUG=True
        AWS_ACCESS_KEY_ID=
        AWS_SECRET_ACCESS_KEY=
        AWS_STORAGE_BUCKET_NAME=
        AWS_S3_ENDPOINT_URL=
        AWS_LOCATION=
        EMAIL_HOST=smtp.gmail.com
        EMAIL_HOST_USER=
        EMAIL_HOST_PASSWORD=
        EMAIL_PORT=587
        EMAIL_USE_TLS=True
        DEFAULT_FROM_EMAIL=test@localhost
        SITE_DOMAIN=localhost:8000
        SITE_PROTOCOL=http
        EOF
