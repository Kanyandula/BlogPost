[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/migrations",
    "node_modules",
    ".venv",
    "static_cdn",
    "media",
    "media_cdn",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",  # line-length is enforced by formatter, not lint
]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
